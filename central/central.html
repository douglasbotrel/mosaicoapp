<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaico · central</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#14201a;--dim:#5b6b62;--line:#d5ddd7;--pri:#14532d;--bad:#b91c1c;--warn:#b45309;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#1a231e;--ink:#eaf1ec;--dim:#9fb2a6;--line:#2f3d35;--pri:#4ade80;--bad:#f87171;--warn:#fbbf24;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",sans-serif}
header{background:#14532d;color:#fff;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem}header h1{margin:0;font-size:1.15rem;flex:1}
nav{display:flex;gap:.3rem;padding:.6rem 1.2rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{border:0;background:none;color:var(--dim);padding:.6rem 1rem;font-size:1rem;border-bottom:3px solid transparent;cursor:pointer}nav button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
main{padding:1rem 1.2rem 3rem;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:.8rem 0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:1.5rem;text-align:center;color:var(--dim)}.drop.over{border-color:var(--pri);background:var(--card)}
button.b{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:.5rem .9rem;font-size:.95rem;cursor:pointer}button.b.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.k{display:flex;gap:.8rem;flex-wrap:wrap}.k div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.6rem 1rem;min-width:120px}.k b{display:block;font-size:1.6rem}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--bg)}
.ERRO{color:var(--bad);font-weight:700}.AVISO{color:var(--warn);font-weight:700}.dim{color:var(--dim)}
.tw{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
label.ck{display:block;margin:.3rem 0}input[type=text],select{padding:.4rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.msg{padding:.5rem .8rem;border-radius:8px;background:var(--card);border-left:4px solid var(--pri);margin:.4rem 0}
</style></head><body>
<header><h1>Mosaico · central de consolidação</h1><span id="hdr" class="dim" style="color:#cde"></span></header>
<nav id="nav"></nav><main id="main"></main>
<script src="vendor/xlsx.full.min.js"></script><script src="vendor/jspdf.umd.min.js"></script>
<script src="lib/schema.js"></script><script src="lib/core.js"></script><script src="lib/validar.js"></script><script src="lib/csv.js"></script><script src="lib/pacote.js"></script><script src="lib/tiles.js"></script><script src="lib/parques_full.js"></script><script src="vendor/geotiff.min.js"></script><script src="geotiff_tiles.js"></script><script src="mapa_offline.js"></script><script src="export.js"></script><script src="pasta.js"></script><script src="central.js"></script>
</body></html>
